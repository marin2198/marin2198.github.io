<main>

    <br>
    <section>
        <h3>haz una reserva</h3>
        <form>
            
            <input type="text" placeholder="Su nombre"><br>
            <input type="text" placeholder="nombre de clientes"><br>
            <input type="text" placeholder="su correo electronico"><br>
            <input type="text" placeholder="su telefono"><br>
            <input type="text" placeholder="su correo electronico"><br>
            <input type="text" placeholder="hora de la reserva"><br>
            <br><br>
            <textarea placeholder="su mensaje"></textarea>

            <input type="submit" value="solicitar reserva">
            <br>
            <p>si desea como protegemos sus datos, consulte nuestra politica de privacidad</p> 
</form>
    </section>
    <br><br><br>

    <section>
        <h3>Envienos un mensaje</h3>
        <br>
        <form>
            <input type="text" placeholder="Su nombre">
            <input type="text" placeholder="su correo electronico">
            <input type="text" placeholder="su telefono"><br>
            <input type="text" placeholder="asunto"><br>
            <br>
            <textarea placeholder="su mensaje"></textarea>
            <br>
            <input type="submit" value="enviar">
            <br>
        </form>
    </section>
    <br><br><br>

    <section>
        <h3>Haz una reseña de nuestros platos</h3>
        <form>
            <label>Nombre: </label><input type="text"><br>
            <label>plato: </label>
            <select>
                <option>Pan casero</option>
                <option>tortilla de patata sencilla</option>
                <option>galletas de limon y almendras</option>
            </select>
            <br>
            <label>reseña:</label>
            <textarea placeholder="reseña"></textarea>
            <br>
            <input type="submit" value="enviar">
        </form>
    </section>
